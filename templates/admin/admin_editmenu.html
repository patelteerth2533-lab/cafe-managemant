<!DOCTYPE html><html lang='en'><head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Edit Menu | Bethak Cafe Admin</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css' rel='stylesheet'>
<link href="admin_style.css" rel="stylesheet">
<link href="admin_responsive.css" rel="stylesheet">
<style>
body{background:#111;color:#fff}.sidebar{position:fixed;width:240px;height:100vh;background:#1b1b1b;padding:20px}
.content{margin-left:240px}.gold{color:#d4af37}.nav-link{color:#ddd}.nav-link.active,.nav-link:hover{color:#d4af37}
.card{background:#222;border:1px solid #333}.btn-gold{background:#d4af37;color:#111}
.preview{width:140px;height:140px;border-radius:10px;background:#333;display:flex;align-items:center;justify-content:center;margin:auto}
.menu-toggle{display:none}
@media(max-width:768px){.menu-toggle{display:inline-block}}
</style></head><body>
<div class='sidebar'>
<h3 class='gold'>☕ Bethak Cafe</h3><hr>
<a class='nav-link' href='admin_dashboard.html'><i class="bi bi-speedometer2"></i> Dashboard</a>
<a class='nav-link' href='admin_order.html'><i class="bi bi-bag-check"></i> Orders</a>
<a class='nav-link' href='admin_reservation.html'><i class="bi bi-calendar-check"></i> Reservations</a>
<a class='nav-link' href='admin_table_manage.html'><i class="bi bi-table"></i> Table Manage</a>
<a class='nav-link' href='admin_advance_booking.html'><i class="bi bi-journal-bookmark-fill"></i> Advance Menu Booking</a>
<a class='nav-link active' href='admin_menu.html'><i class="bi bi-egg-fried"></i> Menu</a>
<a class='nav-link' href='admin_customer.html'><i class="bi bi-people"></i> Customers</a>
<a class='nav-link' href='admin_employe.html'><i class="bi bi-person-badge"></i> Employees</a>
<a class='nav-link' href='admin_inventory.html'><i class="bi bi-box-seam"></i> Inventory</a>
<a class='nav-link' href='admin_payments.html'><i class="bi bi-credit-card"></i> Payments</a>
<a class='nav-link' href='admin_reports.html'><i class="bi bi-graph-up"></i> Reports</a>
<a class='nav-link' href='admin_profile.html'><i class="bi bi-person-circle"></i> Profile</a>
<a class='nav-link' href='admin_seating.html'><i class="bi bi-gear"></i> Settings</a>
</div>
<div class='content'>
<nav class='navbar navbar-dark bg-dark px-4'><button class="btn btn-sm btn-outline-light menu-toggle me-2" id="sidebarToggle"><i class="bi bi-list"></i></button><span class='navbar-brand'>Edit Food Item</span></nav>
<div class='container py-4'><div class='card p-4'>
<div class='text-center mb-3'><div class='preview'>Food Image</div></div>
<form class="save-food-form" data-redirect="admin_menu.html" data-success-msg="Food item updated successfully!">
<div class='mb-3'><label class='form-label'>Food Name</label><input class='form-control' value='Margherita Pizza'></div>
<div class='row'>
<div class='col-md-6 mb-3'><label>Category</label><select class='form-select'><option selected>Fast Food</option><option>Coffee</option><option>Desserts</option></select></div>
<div class='col-md-6 mb-3'><label>Price</label><input type='number' class='form-control' value='299'></div>
</div>
<div class='mb-3'><label>Stock</label><input type='number' class='form-control' value='20'></div>
<div class='mb-3'><label>Description</label><textarea class='form-control' rows='4'>Classic cheese pizza.</textarea></div>
<div class='mb-3'><label>Replace Image</label><input type='file' class='form-control'></div>
<div class='mb-3'><label>Status</label><select class='form-select'><option selected>Available</option><option>Out of Stock</option></select></div>
<button class='btn btn-gold' type="submit">Update Food</button>
<button class='btn btn-danger delete-food-btn' type='button' data-redirect="admin_menu.html">Delete</button>
<a href='admin_menu.html' class='btn btn-secondary'>Cancel</a>
</form></div></div></div>
<script src="admin-animations.js"></script>
</body></html>
