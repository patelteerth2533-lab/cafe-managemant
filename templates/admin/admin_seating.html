<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Bethak Cafe Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="admin_style.css" rel="stylesheet">
<link href="admin_responsive.css" rel="stylesheet">
<style>
body{background:#111;color:#fff}
.sidebar{position:fixed;width:240px;height:100vh;background:#1b1b1b;padding:20px}
.content{margin-left:240px}
.gold{color:#d4af37}
.nav-link{display:block;color:#ddd;text-decoration:none;padding:8px 0}
.nav-link:hover,.active{color:#d4af37}
.card{background:#222;border:1px solid #333}
.btn-gold{background:#d4af37;color:#111}
.menu-toggle{display:none}
@media(max-width:768px){.menu-toggle{display:inline-block}}
</style>
</head>
<body>

<div class="sidebar">
<h3 class="gold">☕ Bethak Cafe</h3><hr>
<a class="nav-link" href="admin_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a class="nav-link" href="admin_order.html"><i class="bi bi-bag-check"></i> Orders</a>
<a class="nav-link" href="admin_reservation.html"><i class="bi bi-calendar-check"></i> Reservations</a>
<a class="nav-link" href="admin_table_manage.html"><i class="bi bi-table"></i> Table Manage</a>
<a class="nav-link" href="admin_advance_booking.html"><i class="bi bi-journal-bookmark-fill"></i> Advance Menu Booking</a>
<a class="nav-link" href="admin_menu.html"><i class="bi bi-egg-fried"></i> Menu</a>
<a class="nav-link" href="admin_customer.html"><i class="bi bi-people"></i> Customers</a>
<a class="nav-link" href="admin_employe.html"><i class="bi bi-person-badge"></i> Employees</a>
<a class="nav-link" href="admin_inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
<a class="nav-link" href="admin_payments.html"><i class="bi bi-credit-card"></i> Payments</a>
<a class="nav-link" href="admin_reports.html"><i class="bi bi-graph-up"></i> Reports</a>
<a class="nav-link" href="admin_profile.html"><i class="bi bi-person-circle"></i> Profile</a>
<a class="nav-link active" href="admin_seating.html"><i class="bi bi-gear"></i> Settings</a>
</div>

<div class="content">
<nav class="navbar navbar-dark bg-dark px-4">
<button class="btn btn-sm btn-outline-light menu-toggle me-2" id="sidebarToggle"><i class="bi bi-list"></i></button>
<span class="navbar-brand">Cafe Settings</span>
</nav>

<div class="container py-4">
<div class="card p-4">
<form class="save-food-form" data-success-msg="Settings saved successfully!">

<div class="mb-3">
<label class="form-label">Cafe Name</label>
<input class="form-control" value="Bethak Cafe">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" value="info@bethakcafe.com">
</div>

<div class="mb-3">
<label class="form-label">Phone</label>
<input class="form-control" value="+91 9876543210">
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" rows="3">Your Cafe Address</textarea>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Opening Time</label>
<input type="time" class="form-control" value="09:00">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Closing Time</label>
<input type="time" class="form-control" value="22:00">
</div>
</div>

<div class="mb-3">
<label class="form-label">Cafe Logo</label>
<input type="file" class="form-control">
</div>

<button class="btn btn-gold">Save Settings</button>

</form>
</div>
</div>

</div>
<script src="admin-animations.js"></script>
</body>
</html>
