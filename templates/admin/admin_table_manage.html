<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Manage | Bethak Cafe Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="admin_style.css" rel="stylesheet">
<link href="admin_responsive.css" rel="stylesheet">
<style>
body{background:#111;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#1b1b1b;padding:20px;overflow-y:auto}
.content{margin-left:240px}
.gold{color:#d4af37}
.nav-link{display:block;color:#ddd;text-decoration:none;padding:8px 0}
.nav-link:hover,.active{color:#d4af37}
.card,.table-box{background:#222;border:1px solid #333}
.table{color:#fff}
.btn-gold{background:#d4af37;color:#111}
.btn-outline-gold{border:1px solid #d4af37;color:#d4af37;background:transparent}
.btn-outline-gold:hover{background:#d4af37;color:#111}
.menu-toggle{display:none}
.table-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.table-tile{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:16px;text-align:center;position:relative}
.table-tile.available{border-color:#2e7d32}
.table-tile.booked{border-color:#b71c1c}
.table-tile h5{margin:6px 0 2px;color:#fff}
.table-tile small{color:#aaa}
.table-tile .status-badge{position:absolute;top:8px;right:8px;font-size:.65rem;padding:2px 8px;border-radius:10px}
.status-badge.available{background:#2e7d32;color:#fff}
.status-badge.booked{background:#b71c1c;color:#fff}
.remove-table-btn{position:absolute;top:6px;left:6px;background:none;border:none;color:#e66;font-size:1rem;cursor:pointer}
.remove-table-btn:hover{color:#ff8080}
@media(max-width:768px){.menu-toggle{display:inline-block}.sidebar{transform:translateX(-100%);transition:.3s;z-index:1050}.sidebar.show{transform:translateX(0)}.content{margin-left:0}}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
<h3 class="gold">☕ Bethak Cafe</h3><hr>
<a class="nav-link" href="admin_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a class="nav-link" href="admin_order.html"><i class="bi bi-bag-check"></i> Orders</a>
<a class="nav-link" href="admin_reservation.html"><i class="bi bi-calendar-check"></i> Reservations</a>
<a class="nav-link active" href="admin_table_manage.html"><i class="bi bi-table"></i> Table Manage</a>
<a class="nav-link" href="admin_advance_booking.html"><i class="bi bi-journal-bookmark-fill"></i> Advance Menu Booking</a>
<a class="nav-link" href="admin_menu.html"><i class="bi bi-egg-fried"></i> Menu</a>
<a class="nav-link" href="admin_customer.html"><i class="bi bi-people"></i> Customers</a>
<a class="nav-link" href="admin_employe.html"><i class="bi bi-person-badge"></i> Employees</a>
<a class="nav-link" href="admin_inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
<a class="nav-link" href="admin_payments.html"><i class="bi bi-credit-card"></i> Payments</a>
<a class="nav-link" href="admin_reports.html"><i class="bi bi-graph-up"></i> Reports</a>
<a class="nav-link" href="admin_profile.html"><i class="bi bi-person-circle"></i> Profile</a>
<a class="nav-link" href="admin_seating.html"><i class="bi bi-gear"></i> Settings</a>
</div>

<div class="content">
<nav class="navbar navbar-dark bg-dark px-4">
<button class="btn btn-sm btn-outline-light menu-toggle me-2" id="sidebarToggle"><i class="bi bi-list"></i></button>
<span class="navbar-brand">Table Manage</span>
</nav>

<div class="container-fluid p-4">

<div class="row g-3 mb-4">
<div class="col-md-3"><div class="card p-3"><small class="gold">Total Tables</small><h3 id="statTotal">0</h3></div></div>
<div class="col-md-3"><div class="card p-3"><small class="gold">Available</small><h3 id="statAvailable">0</h3></div></div>
<div class="col-md-3"><div class="card p-3"><small class="gold">Booked</small><h3 id="statBooked">0</h3></div></div>
<div class="col-md-3"><div class="card p-3"><small class="gold">Total Seats</small><h3 id="statSeats">0</h3></div></div>
</div>

<!-- Add Table Form -->
<div class="card p-4 mb-4">
<h5 class="gold mb-3"><i class="bi bi-plus-circle"></i> Add New Table</h5>
<form id="addTableForm" class="row g-3">
  <div class="col-md-3">
    <label class="form-label">Table No.</label>
    <input type="text" class="form-control" id="newTableNo" placeholder="e.g. T-07" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Seats</label>
    <input type="number" class="form-control" id="newTableSeats" min="1" placeholder="e.g. 4" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Type</label>
    <select class="form-select" id="newTableType">
      <option>Indoor</option>
      <option>Outdoor</option>
      <option>Family</option>
      <option>Window Seat</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Status</label>
    <select class="form-select" id="newTableStatus">
      <option value="available">Available</option>
      <option value="booked">Booked</option>
    </select>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-gold"><i class="bi bi-plus-lg"></i> Add Table</button>
  </div>
</form>
</div>

<!-- Table List -->
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
<h5 class="gold m-0"><i class="bi bi-grid-3x3-gap-fill"></i> All Tables</h5>
<button class="btn btn-outline-gold" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
</div>

<div class="table-box p-3">
<div class="table-card-grid" id="tableGrid"></div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin-animations.js"></script>
<script>
/* ==========================================================
   Table Manage (Admin)
   Add / remove cafe tables.
   Storage: localStorage key "bethak_tables"
   ========================================================== */

const sidebarToggle = document.getElementById('sidebarToggle');
if (sidebarToggle) {
  sidebarToggle.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('show'));
}

const TABLE_KEY = 'bethak_tables';

function getTables() {
  try {
    const stored = JSON.parse(localStorage.getItem(TABLE_KEY));
    if (stored && stored.length) return stored;
  } catch (e) { /* ignore */ }

  /* Seed with default tables the first time this page runs */
  const defaults = [
    { id: 'T-01', seats: 2, type: 'Indoor', status: 'available' },
    { id: 'T-02', seats: 2, type: 'Indoor', status: 'available' },
    { id: 'T-03', seats: 4, type: 'Indoor', status: 'available' },
    { id: 'T-04', seats: 4, type: 'Outdoor', status: 'available' },
    { id: 'T-05', seats: 6, type: 'Family', status: 'available' },
    { id: 'T-06', seats: 4, type: 'Window Seat', status: 'booked' }
  ];
  saveTables(defaults);
  return defaults;
}

function saveTables(tables) {
  localStorage.setItem(TABLE_KEY, JSON.stringify(tables));
}

function renderTables() {
  const tables = getTables();
  const grid = document.getElementById('tableGrid');

  document.getElementById('statTotal').textContent = tables.length;
  document.getElementById('statAvailable').textContent = tables.filter(t => t.status === 'available').length;
  document.getElementById('statBooked').textContent = tables.filter(t => t.status === 'booked').length;
  document.getElementById('statSeats').textContent = tables.reduce((s, t) => s + Number(t.seats || 0), 0);

  if (!tables.length) {
    grid.innerHTML = '<p class="text-secondary text-center py-4">No tables added yet.</p>';
    return;
  }

  grid.innerHTML = tables.map((t, i) => `
    <div class="table-tile ${t.status}">
      <button class="remove-table-btn" title="Remove table" onclick="removeTable(${i})"><i class="bi bi-x-circle-fill"></i></button>
      <span class="status-badge ${t.status}">${t.status === 'available' ? 'Available' : 'Booked'}</span>
      <i class="bi bi-grid-3x3-gap-fill" style="font-size:1.6rem;color:#d4af37"></i>
      <h5>${t.id}</h5>
      <small>${t.seats} Seats &bull; ${t.type}</small>
      <div class="mt-2">
        <button class="btn btn-sm btn-outline-gold" onclick="toggleStatus(${i})">
          Mark ${t.status === 'available' ? 'Booked' : 'Available'}
        </button>
      </div>
    </div>
  `).join('');
}

function toggleStatus(index) {
  const tables = getTables();
  tables[index].status = tables[index].status === 'available' ? 'booked' : 'available';
  saveTables(tables);
  renderTables();
}

function removeTable(index) {
  const tables = getTables();
  const t = tables[index];
  if (!confirm(`Remove table ${t.id}? This cannot be undone.`)) return;
  tables.splice(index, 1);
  saveTables(tables);
  renderTables();
}

document.getElementById('addTableForm').addEventListener('submit', function (e) {
  e.preventDefault();

  const idInput = document.getElementById('newTableNo');
  const seatsInput = document.getElementById('newTableSeats');
  const typeInput = document.getElementById('newTableType');
  const statusInput = document.getElementById('newTableStatus');

  const id = idInput.value.trim();
  const seats = seatsInput.value.trim();

  if (!id || !seats) {
    alert('Please enter table number and seats.');
    return;
  }

  const tables = getTables();
  if (tables.some(t => t.id.toLowerCase() === id.toLowerCase())) {
    alert('A table with this number already exists.');
    return;
  }

  tables.push({
    id: id,
    seats: Number(seats),
    type: typeInput.value,
    status: statusInput.value
  });

  saveTables(tables);
  renderTables();

  idInput.value = '';
  seatsInput.value = '';
  typeInput.selectedIndex = 0;
  statusInput.selectedIndex = 0;
});

document.getElementById('refreshBtn').addEventListener('click', renderTables);

renderTables();
</script>
</body>
</html>
