{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bethak Cafe</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/all-animations.css' %}">

</head>

<body class="page-login">

    <!--=========================
        BACKGROUND OVERLAY
    ==========================-->

    <div class="bg-overlay"></div>

    <!-- Floating Particles -->

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>

    <!--=========================
        LOGIN SECTION
    ==========================-->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center align-items-center vh-100">

                <div class="col-lg-5 col-md-8">

                    <div class="login-card">

                        <!-- Logo -->

                        <div class="text-center">

                            <img src="{% static 'image/logo.png' %}" class="logo" alt="Logo">

                            <h2>Welcome Back</h2>

                            <p>
                                Sign in to continue your Bethak Cafe experience
                            </p>

                        </div>

                        <!-- Login Form -->

                        <form id="loginForm">

                            <!-- Login As: Customer / Admin -->

                            <div class="role-toggle">

                                <label class="role-option">
                                    <input type="radio" name="role" value="customer" checked>
                                    <span>Customer</span>
                                </label>

                                <label class="role-option">
                                    <input type="radio" name="role" value="admin">
                                    <span>Admin</span>
                                </label>

                            </div>

                            <!-- Email -->

                            <div class="input-box">

                                <i class="bi bi-envelope-fill"></i>

                                <input type="email"
                                    name="email"
                                    placeholder="Enter Email Address"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="input-box password-box">

                                <i class="bi bi-lock-fill"></i>

                                <input type="password"
                                    placeholder="Enter Password"
                                    id="password"
                                    name="password"
                                    required>

                                <span class="toggle-password">

                                    <i class="bi bi-eye-fill"></i>

                                </span>

                            </div>

                            <!-- Remember -->

                            <div class="remember-area">

                                <label>

                                    <input type="checkbox">

                                    Remember Me

                                </label>

                                <a href="#">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Login -->

                            <button class="login-btn" type="submit">

                                LOGIN

                                <i class="bi bi-arrow-right"></i>

                            </button>

                        </form>

                        <!-- Divider -->

                        <div class="divider">

                            <span></span>

                            <p>OR CONTINUE WITH</p>

                            <span></span>

                        </div>

                        <!-- Social -->

                        <div class="social-login">

                            <a href="#" class="google">

                                <i class="bi bi-google"></i>

                                Google

                            </a>

                            <a href="#" class="github">

                                <i class="bi bi-github"></i>

                                GitHub

                            </a>

                        </div>

                        <!-- Register -->

                        <div class="register-link">

                            Don't have an account?

                            <a href="{% url 'register' %}" clas
                            s="register-btn">

                                Register Now

                            </a>

                        </div>

                        <!-- Back -->

                        <div class="back-home">

                            <a href="{% url 'home' %}">

                                <i class="bi bi-arrow-left"></i>

                                Back to Home

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="{% static 'js/all-animations.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
