<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Bethak Cafe</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="all-animations.css">

</head>

<body class="page-register">

    <!-- Background Overlay -->
    <div class="bg-overlay"></div>

    <!-- Floating Particles -->
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>

    <!--=========================
        REGISTER SECTION
    ==========================-->

    <section class="register-section">

        <div class="container">

            <div class="row justify-content-center align-items-center min-vh-100">

                <div class="col-lg-6 col-md-8">

                    <div class="register-card">

                        <!-- Logo -->

                        <div class="text-center">

                            <img src="image/logo.png" class="logo" alt="Bethak Cafe">

                            <h2>Create Account</h2>

                            <p>
                                Join the Bethak Cafe Family Today
                            </p>

                        </div>

                        <!-- Register Form -->

                        <form action="#" method="post">

                            <!-- Full Name -->

                            <div class="input-box">

                                <i class="bi bi-person-fill"></i>

                                <input type="text"
                                    name="fullname"
                                    placeholder="Enter Full Name"
                                    required>

                            </div>

                            
                                                        <!-- Mobile Number -->

                            <div class="input-box">

                                <i class="bi bi-telephone-fill"></i>

                                <input type="tel"
                                    name="mobile"
                                    placeholder="Enter Mobile Number"
                                    maxlength="10"
                                    required>

                            </div>


                            <!-- Email -->

                            <div class="input-box">

                                <i class="bi bi-envelope-fill"></i>

                                <input type="email"
                                    name="email"
                                    placeholder="Enter Email Address"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="input-box password-box">

                                <i class="bi bi-lock-fill"></i>

                                <input type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Create Password"
                                    required>

                                <span class="toggle-password">

                                    <i class="bi bi-eye-fill"></i>

                                </span>

                            </div>

                            <!-- Password Strength -->

                            <div class="password-strength">

                                <div class="strength-bar"></div>

                            </div>

                            <small class="strength-text">
                                Password must contain at least 8 characters.
                            </small>

                            <!-- Confirm Password -->

                            <div class="input-box password-box">

                                <i class="bi bi-shield-lock-fill"></i>

                                <input type="password"
                                    id="confirmPassword"
                                    name="confirm_password"
                                    placeholder="Confirm Password"
                                    required>

                                <span class="toggle-password">

                                    <i class="bi bi-eye-fill"></i>

                                </span>

                            </div>

                            <!-- Terms & Conditions -->

                            <div class="terms-area">

                                <label>

                                    <input type="checkbox" required>

                                    I agree to the
                                    <a href="#">Terms & Conditions</a>

                                </label>

                            </div>

                            <!-- Register Button -->

                            <button class="register-btn" type="submit">

                                CREATE ACCOUNT

                                <i class="bi bi-arrow-right-circle-fill"></i>

                            </button>
                                                        <!-- Divider -->

                            <div class="divider">

                                <span></span>

                                <p>OR CONTINUE WITH</p>

                                <span></span>

                            </div>

                            <!-- Social Login -->

                            <div class="social-login">

                                <a href="#" class="google">

                                    <i class="bi bi-google"></i>

                                    Google

                                </a>

                                <a href="#" class="github">

                                    <i class="bi bi-github"></i>

                                    GitHub

                                </a>

                            </div>

                            <!-- Login Link -->

                            <div class="login-link">

                                Already have an account?

                                <a href="login.html">

                                    Login

                                </a>

                            </div>

                            <!-- Back Home -->

                            <div class="back-home">

                                <a href="index.html">

                                    <i class="bi bi-arrow-left"></i>

                                    Back to Home

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Register JS (Future Use) -->

    <script src="all-animations.js"></script>
    <script src="main.js"></script>

</body>

</html>
